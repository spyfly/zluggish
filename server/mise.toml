[tools]
node = '26'
pnpm = '12.18.0'

[tasks.install]
description = 'Install server, including its admin CLI dependencies'
run = 'pnpm install --frozen-lockfile'

[tasks.build]
description = 'Build server, including its admin CLI'
run = 'pnpm build'

[tasks.test]
description = 'Run server, including its admin CLI tests'
depends = ['build']
run = 'pnpm test'

[tasks.lint]
description = 'Lint and typecheck server, including its admin CLI'
depends = ['build']
run = ['pnpm lint', 'pnpm typecheck', 'pnpm check:web']

[tasks.format-fix]
description = 'Format project files'
run = 'pnpm format:fix'

[tasks.format]
description = 'Check project formatting'
run = 'pnpm format'

[tasks.check]
description = 'Run lint, formatting checks, and tests'
depends = ['lint', 'format', 'test']

[tasks.dev]
alias = 'server-dev'
description = 'Run the full stack at http://localhost:5173 with hot updates'
depends = ['dev:server', 'dev:web']

[tasks."dev:assets"]
description = 'Build launcher assets for the development server'
run = 'pnpm --dir ../web build:game'

[tasks."dev:server"]
description = 'Run the local backend with automatic restarts'
depends = ['dev:assets']
run = 'pnpm exec tsx watch --conditions=development --import ./scripts/register-svelte.mjs src/main.ts --config dev/zluggish.config.ts'

[tasks."dev:web"]
description = 'Run Vite with frontend hot updates'
run = 'pnpm --dir ../web exec vite --mode app'

[tasks.server-codegen]
description = 'Generate TypeScript protobuf codecs'
run = 'pnpm codegen'

[tasks.cli]
description = 'Run CLI from source'
run = 'pnpm cli'
